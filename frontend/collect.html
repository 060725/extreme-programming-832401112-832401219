<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 电话簿</title>
    <link rel="stylesheet" href="css/index.css"/>
</head>
<body>

<div class="container">
    <h1>★ 我的收藏</h1>

    <div class="toolbar">
        <button class="collect" onclick="window.location.href='index.html'">返回首页</button>
        <input type="text" id="searchInput" placeholder="在收藏中搜索姓名..." autocomplete="off">
    </div>

    <table id="phonebookTable">
        <thead>
        <tr>
            <th class="col-star">收藏</th>
            <th>姓名</th>
            <th>手机号码</th>
            <th>邮箱</th>
            <th>地址</th>
            <th class="col-action">操作</th>
        </tr>
        </thead>
        <tbody id="phonebookTbody">
        </tbody>
    </table>
</div>

<script src="js/config.js"></script>
<script src="js/collect.js"></script>

</body>
</html>
