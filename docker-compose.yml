services:
  mysql:
    image: mysql:8.0
    container_name: phonebook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: phonebook
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: phonebook-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: phonebook
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      SERVER_PORT: "8888"
      TZ: Asia/Shanghai
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.25-alpine
    container_name: phonebook-web
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
